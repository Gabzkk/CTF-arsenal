# Rainbow table specific configuration

# Algorithm: md5 | sha1 | sha256
algorithm       = md5

# Chain length (higher = more coverage, slower to generate, faster to query)
chain_length    = 100

# Number of chains
num_chains      = 50000

# Plaintext length (characters to crack)
plain_len       = 6

# Output table file
table_file      = rainbow.rt
