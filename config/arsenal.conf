# CTF Arsenal global configuration
# Format: key = value  (# for comments)

# General
verbosity         = 1
threads           = 4
timeout_ms        = 3000

# SecLists & Wordlist configuration
seclists_root     = /home/sunburnz/Desktop/HAckTools/SecLists
default_wordlist  = wordlists/seclists/passwords/top10k.txt
wordlist          = wordlists/rockyou_sample.txt
mutations         = wordlists/mutations.txt

# Integrated SecLists aliases:
# top1k      -> Passwords/Common-Credentials/Pwdb_top-1000.txt
# top10k     -> Passwords/Common-Credentials/10k-most-common.txt
# top100k    -> Passwords/Common-Credentials/100k-most-used-passwords-NCSC.txt
# top1m      -> Passwords/Common-Credentials/xato-net-10-million-passwords-1000000.txt
# best1050   -> Passwords/Common-Credentials/best1050.txt
# defaults   -> Passwords/Default-Credentials/default-passwords.txt
# darkweb    -> Passwords/Common-Credentials/darkweb2017_top-1000.txt
# rockyou    -> /home/sunburnz/Desktop/HAckTools/rockyou.txt
# web        -> Discovery/Web-Content/common.txt
# raft_dirs  -> Discovery/Web-Content/raft-medium-directories.txt
# burp_params-> Discovery/Web-Content/burp-parameter-names.txt
# subdomains -> Discovery/DNS/subdomains-top1million-5000.txt
# lfi        -> Fuzzing/LFI/LFI-Jhaddix.txt
# xss        -> Fuzzing/XSS/human-friendly/XSS-Jhaddix.txt
# sqli       -> Fuzzing/Databases/SQLi/Generic-SQLi.txt
# ai_escape  -> Ai/LLM_Testing/Divergence_attack/escape_out_of_allignment_training.txt

# Rainbow table defaults
rainbow_table     = rainbow.rt
rainbow_alg       = md5
rainbow_chains    = 10000
rainbow_chain_len = 100
rainbow_plain_len = 6

# Stego
lsb_bits          = 1

# Fuzzer
fuzz_count        = 100
fuzz_host         = 127.0.0.1
fuzz_port         = 80

# Output
output_dir        = ./output
log_file          = ./ctf_arsenal.log
